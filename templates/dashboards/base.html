<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Hospital System{% endblock %}</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .btn {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        .btn-back {
            background: #e74c3c;
        }

        .btn-download {
            background: #27ae60;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .table th {
            background: #34495e;
            color: white;
            padding: 10px;
            text-align: left;
        }

        .table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .table tr:hover {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>🏥 Hospital Management System</h2>
</div>

<div class="container">

    <!-- BACK BUTTON (GLOBAL) -->
    <a href="javascript:history.back()" class="btn btn-back">⬅ Back</a>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
